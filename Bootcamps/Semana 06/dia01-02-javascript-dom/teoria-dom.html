<h1>DOM (Document Object Model)</h1>
<p> Es una representación en memoria de un documento HTML o XML.</p>

<ul>
    <li>leer contenido de la pagina</li>
    <li>cambiar textos, atributos y estilos en la pagina</li>
    <li>Crear o eliminar elementos</li>
    <li>Escuchar eventos de la pagina</li>
</ul>

<script>
    console.log('Hola Dom')
    console.log(document)
    console.log({document: document})
    console.log(document.title)// leemos el titulo de la pagina
    document.title = 'Nuevo titulo' // Escritura de un titulo para la pagina
</script>
</body>
